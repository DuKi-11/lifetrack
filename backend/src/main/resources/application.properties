spring.application.name=lifetrack
server.port=8080

# Local database: a file in ./data, so your data survives restarts
spring.datasource.url=jdbc:h2:file:./data/lifetrack;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browse the database at http://localhost:8080/h2-console (JDBC URL above, user sa)
spring.h2.console.enabled=true

# Sign-in tokens. Override LIFETRACK_JWT_SECRET in production (at least 32 characters).
lifetrack.jwt.secret=${LIFETRACK_JWT_SECRET:change-me-dev-secret-change-me-dev-secret-0123456789}
lifetrack.jwt.expiration-hours=168

# Frontend dev server allowed to call the API
lifetrack.cors.allowed-origins=${LIFETRACK_CORS_ORIGINS:http://localhost:5173}

# Automatic backups (local H2 only): on startup and nightly at 03:00, newest 14 kept
lifetrack.backup.folder=./backups
lifetrack.backup.keep=14
